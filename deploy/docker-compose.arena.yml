services:
  mini-redis:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "cmd/mini_redis_server/main.py"]
    environment:
      MINI_REDIS_SERVER_HOST: 0.0.0.0
      MINI_REDIS_SERVER_PORT: 6379
    ports:
      - "6379:6379"

  mongo-a:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_a_data:/data/db

  mongo-b:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_b_data:/data/db

  lane-a:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "cmd/arena_lane_a/main.py"]
    environment:
      ARENA_LANE_A_HOST: 0.0.0.0
      ARENA_LANE_A_PORT: 8001
      ARENA_REDIS_BACKEND: redis_py
      MINI_REDIS_HOST: mini-redis
      MINI_REDIS_PORT: 6379
      ARENA_MONGO_BACKEND: pymongo
      MONGO_URI: mongodb://mongo-a:27017
      MONGO_DB_NAME: arena_lane_a
    depends_on:
      - mini-redis
      - mongo-a
    ports:
      - "8001:8001"

  lane-b:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "cmd/arena_lane_b/main.py"]
    environment:
      ARENA_LANE_B_HOST: 0.0.0.0
      ARENA_LANE_B_PORT: 8002
      ARENA_MONGO_BACKEND: pymongo
      MONGO_URI: mongodb://mongo-b:27017
      MONGO_DB_NAME: arena_lane_b
    depends_on:
      - mongo-b
    ports:
      - "8002:8002"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "cmd/arena_gateway/main.py"]
    environment:
      ARENA_HOST: 0.0.0.0
      ARENA_PORT: 8000
      ARENA_LANE_A_BASE_URL: http://lane-a:8001
      ARENA_LANE_B_BASE_URL: http://lane-b:8002
    depends_on:
      - lane-a
      - lane-b
    ports:
      - "8000:8000"

volumes:
  mongo_a_data:
  mongo_b_data:
